"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](surface0)\
$os\
$username\
[](bg:peach fg:surface0)\
$directory\
[](fg:peach bg:green)\
$git_branch\
$git_status\
[](fg:green bg:teal)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$dotnet\
[](fg:teal bg:blue)\
$docker_context\
$kubernetes\
[](fg:blue bg:mauve)\
$time\
[ ](fg:mauve)\
$cmd_duration\
$jobs\
$line_break$character"""

palette = 'catppuccin_mocha'
add_newline = true
command_timeout = 1000

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo  = "#f2cdcd"
pink      = "#f5c2e7"
mauve     = "#cba6f7"
red       = "#f38ba8"
maroon    = "#eba0ac"
peach     = "#fab387"
yellow    = "#f9e2af"
green     = "#a6e3a1"
teal      = "#94e2d5"
sky       = "#89dceb"
sapphire  = "#74c7ec"
blue      = "#89b4fa"
lavender  = "#b4befe"
text      = "#cdd6f4"
overlay0  = "#6c7086"
surface0  = "#313244"
base      = "#1e1e2e"
crust     = "#11111b"

[os]
disabled = false
style = "bg:surface0 fg:text"
format = '[ $symbol]($style)'

[os.symbols]
Windows = ""
Ubuntu  = ""
Debian  = ""
Arch    = "󰣇"
Macos   = "󰀵"

[username]
show_always = true
style_user = "bg:surface0 fg:text"
style_root = "bg:surface0 fg:red"
format = '[ $user ]($style)'

[directory]
style = "fg:crust bg:peach"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"

[directory.substitutions]
"Documents"    = "󰈙 "
"Downloads"    = " "
"Music"        = "󰝚 "
"Pictures"     = " "
"Developer"    = "󰲋 "
"Desktop"      = " "
"OneDrive"     = "󰅨 "

[git_branch]
symbol = ""
style = "bg:green fg:crust"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:green fg:crust"
format = '[($all_status$ahead_behind )]($style)'
conflicted = "!${count} "
ahead      = "⇡${count} "
behind     = "⇣${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
untracked  = "?${count} "
stashed    = "*${count} "
modified   = "~${count} "
staged     = "+${count} "
renamed    = "»${count} "
deleted    = "✘${count} "

[c]
symbol = " "
style = "bg:teal fg:crust"
format = '[ $symbol($version) ]($style)'

[rust]
symbol = ""
style = "bg:teal fg:crust"
format = '[ $symbol ($version) ]($style)'

[golang]
symbol = ""
style = "bg:teal fg:crust"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:teal fg:crust"
format = '[ $symbol ($version) ]($style)'

[php]
symbol = ""
style = "bg:teal fg:crust"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:teal fg:crust"
format = '[ $symbol ($version) ]($style)'

[kotlin]
symbol = ""
style = "bg:teal fg:crust"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = ""
style = "bg:teal fg:crust"
format = '[ $symbol ($version) ]($style)'

[python]
symbol = ""
style = "bg:teal fg:crust"
format = '[ $symbol ($version)(\($virtualenv\)) ]($style)'

[dotnet]
symbol = "󰪮"
style = "bg:teal fg:crust"
format = '[ $symbol ($tfm) ]($style)'

[docker_context]
symbol = ""
style = "bg:blue fg:crust"
format = '[ $symbol $context ]($style)'
only_with_files = true

[kubernetes]
disabled = false
symbol = "󱃾"
style = "bg:blue fg:crust"
format = '[ $symbol $context ]($style)'
detect_files = ['k8s', 'kubeconfig']

[time]
disabled = false
time_format = "%R"
style = "bg:mauve fg:crust"
format = '[  $time ]($style)'

[cmd_duration]
min_time = 500
style = "fg:yellow"
format = '[ 󱎫 $duration]($style)'
show_notifications = false

[jobs]
symbol = ""
style = "fg:sky"
format = '[ $symbol$number]($style)'

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold mauve)'

[line_break]
disabled = false
